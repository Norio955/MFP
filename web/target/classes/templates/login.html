<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вхід</title>
</head>
<body>
<h2>Авторизація</h2>
<div th:if="${param.error}" style="color: red;">Невірний email або пароль.</div>
<div th:if="${param.logout}" style="color: green;">Ви успішно вийшли з системи.</div>

<form th:action="@{/login}" method="post">
    <div>
        <label> Email: <input type="email" name="email" required/> </label>
    </div>
    <div>
        <label> Пароль: <input type="password" name="password" required/> </label>
    </div>
    <div>
        <button type="submit">Увійти</button>
    </div>
</form>
<p>Немає акаунту? <a th:href="@{/register}">Зареєструватися</a></p>
</body>
</html>
